[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overfitlab"
version = "0.1.0"
description = "Small-scale deep learning experiment demonstrating diagnosed overfitting and applied correction."
authors = [{ name = "Bibek Dhakal" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "scikit-learn",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3.0",
    "pre-commit"
]

[tool.hatch.build.targets.wheel]
packages = ["src/overfitlab"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src/overfitlab"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long, handled by formatter
]